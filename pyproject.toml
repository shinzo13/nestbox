[project]
name = "nestbox"
version = "0.1.0"
description = "A home for Claude Code agents in Telegram: forum topics as branches, an orchestrator that delegates, a journal it keeps for itself"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.26.0",
    "aiohttp~=3.12.15",
    "claude-agent-sdk>=0.2.152",
    "pydantic>=2.11.10",
    "pydantic-settings>=2.12.0",
    "telethon>=1.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
